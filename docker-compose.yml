# Local stack. Works with `docker compose up --build` or `podman compose up --build`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seats
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: seats
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seats -d seats"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: seat-reservation:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/seats
      DATABASE_USERNAME: seats
      DATABASE_PASSWORD: seats
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-admin-key}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-change-me-0123456789abcdef}
    ports:
      - "8080:8080"
    restart: unless-stopped
