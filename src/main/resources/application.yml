spring:
  application:
    name: seat-reservation
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/seats}
    username: ${DATABASE_USERNAME:seats}
    password: ${DATABASE_PASSWORD:seats}
    hikari:
      pool-name: seats-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # Money is integer paise: reject 250.5 instead of truncating it.
      accept-float-as-int: false
      fail-on-null-for-primitives: true

seats:
  admin-api-key: ${ADMIN_API_KEY:}
  jwt-secret: ${JWT_SECRET:}
  jwt-ttl: ${JWT_TTL:1h}
  max-tokens-per-request: 10000
  max-seats-per-show: ${MAX_SEATS_PER_SHOW:10000}
  default-per-user-limit: 4

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    max-connections: 20000
    accept-count: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: seat-reservation

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
