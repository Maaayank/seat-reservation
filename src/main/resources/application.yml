spring:
  application:
    name: seat-reservation
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/seats}
    username: ${DATABASE_USERNAME:seats}
    password: ${DATABASE_PASSWORD:seats}
    hikari:
      pool-name: seats-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      # Session-level DB timeouts, set once per pooled connection (no per-request round trip).
      # A lock timeout surfaces as a 500 on purpose: it must not happen in a healthy system.
      connection-init-sql: "SET lock_timeout = '5s'; SET statement_timeout = '10s'; SET idle_in_transaction_session_timeout = '30s'"
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # Money is integer paise: reject 250.5 instead of truncating it.
      accept-float-as-int: false
      fail-on-null-for-primitives: true

seats:
  admin-api-key: ${ADMIN_API_KEY:}
  jwt-secret: ${JWT_SECRET:}
  jwt-ttl: ${JWT_TTL:1h}
  # Fast-decline layers (docs/DISCOVERY.md §6.2). They only decline faster;
  # the DB transaction stays the only authority that grants a seat.
  layers:
    sold-set: ${LAYER_SOLD_SET:true}
    read-check: ${LAYER_READ_CHECK:true}
    seat-claim: ${LAYER_SEAT_CLAIM:true}
    seat-claim-timeout: ${LAYER_SEAT_CLAIM_TIMEOUT:5s}
  max-seats-per-show: ${MAX_SEATS_PER_SHOW:10000}

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    max-connections: 20000
    accept-count: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: seat-reservation
    distribution:
      # Buckets for histogram_quantile() latency panels and alerts.
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
